Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'config/environments/development.rb'
    - 'db/schema.rb'
    - 'spec/**/*'
    - 'test/**'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'
